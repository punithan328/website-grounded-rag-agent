[project]
name = "website-grounded-rag-agent"
version = "0.1.0"
description = "Website-grounded RAG agent using LangGraph, LangChain, ChromaDB and Chainlit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4",
    "chromadb",
    "httpx",
    "lxml",
    "pydantic",
    "python-dotenv",
    "sentence-transformers",
    "trafilatura",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]